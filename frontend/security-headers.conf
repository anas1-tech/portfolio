# Security headers for the React site (not for /api or /admin, which Django handles itself).
# 'unsafe-inline' styles: React style attributes and antd's CSS-in-JS in the admin need them.
# If the API or uploaded images live on another origin (VITE_API_URL), add it to connect-src and img-src.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header X-Frame-Options "DENY" always;
